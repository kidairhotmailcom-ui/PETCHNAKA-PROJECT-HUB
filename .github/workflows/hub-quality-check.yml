name: Project Hub Quality Check

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "README.md"
      - "scripts/check_hub.py"
      - ".github/workflows/hub-quality-check.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hub-quality-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate Hub page
        run: python scripts/check_hub.py

      - name: Check AUTO SHOP PRO destination
        shell: bash
        run: |
          set -euo pipefail
          URL="https://kidairhotmailcom-ui.github.io/AUTO-SHOP-PRO/"
          curl --fail --location --silent --show-error --retry 3 --retry-delay 5 --max-time 45 "$URL" -o /tmp/auto-shop-pro.html
          grep -qi "AUTO SHOP PRO" /tmp/auto-shop-pro.html
          echo "PASS: AUTO SHOP PRO destination responds and contains the expected product name"
