    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#a5f3fc"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#020617" flood-opacity=".35"/></filter>
  </defs>
  <rect width="1600" height="700" rx="36" fill="url(#bg)"/>
  <circle cx="1370" cy="90" r="260" fill="#38bdf8" opacity=".10"/><circle cx="1500" cy="620" r="300" fill="#22d3ee" opacity=".08"/>
