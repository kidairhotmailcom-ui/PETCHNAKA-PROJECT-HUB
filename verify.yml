name: Verify Backup

on:
  workflow_dispatch:
  schedule:
    - cron: "45 18 * * *" # 01:45 Thailand time

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout backup branch
        uses: actions/checkout@v4
        with:
          ref: backup
          fetch-depth: 1

      - name: Verify SHA-256 manifest
        shell: bash
        run: |
          set -euo pipefail
          test -s backup/MANIFEST.sha256
          sha256sum -c backup/MANIFEST.sha256
          echo "Backup verification passed."
